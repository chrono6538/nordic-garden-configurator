<div class=&quot;cover&quot;>
<h1>NGB — Pricing &amp;amp; Competitive Pack</h1>
<div class=&quot;sub&quot;>Prepared for the TGP pricing discussion · 22 August 2026</div>

<div class=&quot;box&quot;><h2>1 · The pricing imbalance (2023 → today)</h2>
<p>Cost inflation since 2023 reached <b>+27.5%</b>, but the final <b>10% surcharge added on 1 July 2026 is being lifted by our suppliers</b>, bringing the sustainable underlying increase back to <span class=&quot;big&quot;>+17.5%</span> — the level we price to. Against that, TGP's actual increases average +17.6% but range from +3% to +30% — applied inconsistently. <b>White finishes rose only ~+12%, colour ~+23%</b>; some models (Melbourne, Manhattan, Ramsey Flat) are under-raised, others (Greenwich, colour SKUs) over-raised. Rebasing to a clean 2023 + 17.5% is <b>revenue-neutral overall (−0.8%)</b> — 152 over-priced lines come down (avg −4.7%), 102 under-priced lines go up (avg +5%). Section&amp;nbsp;A shows every model with the exact CUT % / RAISE % per line.</p></div>

<div class=&quot;box&quot;><h2>2 · Where NGB really sits vs the market</h2>
<p>On a verified, like-for-like <b>installed + base</b> basis, NGB is <b>mid-pack, not the outlier</b> TGP claims. At ~4×3m, NGB Anglesey (£21,949) is only undercut by three budget-timber makers; Crown, Cabin Master, Booths sit level or above and eDEN far above. Section&amp;nbsp;B — every figure independently source-checked and linked.</p></div>

<div class=&quot;box&quot;><h2>3 · What this supports</h2>
<p>Rebase the range to a clean <b>2023 + 17.5%</b> and re-equalise into consistent bands (pulls over-raised colour/Greenwich down, lifts under-raised whites up). The competitive evidence shows there is <b>no whole-range &quot;too expensive&quot; problem</b> — only small units vs budget timber. The real lever remains the commission and TGP's withdrawn marketing.</p></div>

<div class=&quot;meta&quot;>Sources: Nordic 2023 brochure · Nordic 1 July 2026 price list · each competitor's live pricing page (links in Section B) · NGB order data Jan–Jun 2026. Competitor figures independently re-verified 22 Aug 2026; SMART Garden Offices excluded (prices unverifiable). Base allowance +£1,500 (small) / +£2,200 (mid) added where a maker excludes it; electrics excluded from all figures.</div>
</div></body></html>

<h1>The core issue: a marketing problem, not a pricing problem</h1>
<div class=&quot;tag&quot;>NGB → TGP · opening statement · August 2026</div>

<div class=&quot;lead&quot;>Sales are down ~50% on 2025. The evidence says this is a demand and promotion failure — not customers rejecting our prices — and it began the moment TGP stopped actively marketing NGB.</div>

<p>Our quote data makes the cause clear. The <b>value</b> of the quotes being generated is in line with 2025 — the customers who reach a quote are <b>not</b> being put off by price. What has fallen is the <b>number</b> of quotes and the <b>conversion</b> of those quotes into orders. That is a top-of-funnel and sales-effort problem: fewer people are being brought to the table, and fewer of those are being closed. It coincides precisely with TGP ceasing to actively market NGB from <span class=&quot;kick&quot;>November 2025</span>. A price cut does not fix a marketing withdrawal — it simply gives away margin on the smaller number of sales still coming through.</p>

<p>The two analyses in this pack remove any doubt that price is the cause. The <b>pricing audit</b> shows our whole range can be rebased to a fair 2023&amp;nbsp;+&amp;nbsp;17.5% on a <b>revenue-neutral basis (−0.8% overall)</b> — it corrects historic inconsistency rather than raising prices. (Our costs actually rose 27.5% since 2023, but the 10% surcharge added on 1&amp;nbsp;July&amp;nbsp;2026 is being lifted by our suppliers, so 17.5% is the sustainable level.) The <b>competitor comparison</b>, with every figure verified against each rival's own published price on a true installed-plus-base footing, shows NGB sits <b>mid-pack</b> — cheaper than eDEN and premium Crown, and undercut only by budget timber makers. TGP's &quot;too expensive&quot; claim is not supported by the market.</p>

<div class=&quot;ask&quot;>The conclusion is straightforward: <b>TGP has not upheld its side of the arrangement — to actively promote NGB</b> — and that, not our pricing, is what has halved sales. The route back to volume is TGP <b>restarting the marketing and show-site prominence it committed to</b>, alongside correcting the pricing imbalance detailed in the following pages. The pricing evidence is here to close off the &quot;too expensive&quot; argument; the real fix is promotion.</div>
