<h1>NGB — Pricing &amp;amp; Competitive Pack</h1>
<div class=&quot;sub&quot;>Prepared for the TGP pricing discussion · like-for-like on verified data</div>

<div class=&quot;kpis&quot;>
<div class=&quot;kpi&quot;><div class=&quot;n bad&quot;>−12%</div><div class=&quot;l&quot;>Customers quoted<br>827 → 726</div></div>
<div class=&quot;kpi&quot;><div class=&quot;n good&quot;>+7%</div><div class=&quot;l&quot;>Quote value<br>£13.65m → £14.62m</div></div>
<div class=&quot;kpi&quot;><div class=&quot;n bad&quot;>−56%</div><div class=&quot;l&quot;>Units sold<br>232 → 103</div></div>
<div class=&quot;kpi&quot;><div class=&quot;n bad&quot;>½</div><div class=&quot;l&quot;>Conversion<br>28% → 14%</div></div>
</div>

<div class=&quot;card&quot;><h2><span class=&quot;num&quot;>1</span>The pricing imbalance</h2>
<ul>
<li>Cost inflation since 2023 = <b>+27.5%</b> — but the <b>10% July-2026 surcharge is being lifted</b> by suppliers.</li>
<li>The real increase ran over <b>two periods</b> — <b>+10%</b>, then <b>+7.5%</b> on top = <span class=&quot;hl&quot;>+18.25%</span> on the 2023 price. That's the target.</li>
<li>TGP's increases are <b>inconsistent</b>: whites ~+12%, colour ~+23%; some models under-raised, others over-raised.</li>
<li>Rebasing to the 2023 +10%-then-+7.5% target is <b>broadly revenue-neutral (−0.55%)</b>: 132 lines come down, 122 go up.</li>
</ul></div>

<div class=&quot;card&quot;><h2><span class=&quot;num&quot;>2</span>Where NGB really sits vs the market</h2>
<ul>
<li>Once every rival is <b>specced up to match NGB</b> (coloured finish, top cladding, floor + internal finishes, insulated, installed), NGB is <b>mid-pack — not the outlier</b> TGP claims.</li>
<li>At ~4×3m, Anglesey (£21,949) has only <b>Pent Haus, Noah and Cabin Master below it</b>.</li>
<li>Booths, Crown, a fully-specced Malvern (£26.9k), Green Retreats and eDEN all sit <b>above</b>.</li>
</ul></div>

<div class=&quot;card&quot;><h2><span class=&quot;num&quot;>3</span>The real problem is conversion — not quote volume</h2>
<ul>
<li>Customers quoted fell <b>only −12%</b>; quote value actually <b>rose +7%</b>.</li>
<li>Yet units sold <b>more than halved</b> (232 → 103).</li>
<li><span class=&quot;hl&quot;>The business is being lost at the close, not the quote.</span></li>
</ul></div>

<div class=&quot;card&quot;><h2><span class=&quot;num&quot;>4</span>What this supports — three levers, not one</h2>
<ul>
<li><b>Price:</b> rebase to the 2023 +10%-then-+7.5% target (+18.25%), re-equalise the bands (revenue-neutral).</li>
<li><b>Selling:</b> invest in conversion — training, follow-up, closing — where the loss sits.</li>
<li><b>Marketing:</b> rebuild NGB promotion to lift quote volume.</li>
</ul></div>

<h1>The issue: the loss is at the close</h1>
<div class=&quot;sub&quot;>Jan–Aug, like-for-like · one quote per customer · Mint quote export + NGB sales ledger</div>

<div class=&quot;banner&quot;>Demand is broadly holding and quote values are up — yet units sold have more than halved.</div>

<div class=&quot;kpis&quot;>
<div class=&quot;kpi&quot;><div class=&quot;n&quot;>−12%</div><div class=&quot;l&quot;>Customers quoted<br><b>827 → 726</b></div></div>
<div class=&quot;kpi up&quot;><div class=&quot;n&quot;>+7%</div><div class=&quot;l&quot;>Quote value<br><b>£13.65m → £14.62m</b></div></div>
<div class=&quot;kpi&quot;><div class=&quot;n&quot;>−56%</div><div class=&quot;l&quot;>Units sold<br><b>232 → 103</b></div></div>
<div class=&quot;kpi&quot;><div class=&quot;n&quot;>28→14%</div><div class=&quot;l&quot;>Conversion<br><b>roughly halved</b></div></div>
</div>
<div class=&quot;callwrap&quot;><div class=&quot;callout&quot;><span class=&quot;h&quot;>Why 14% is the true rate</span>Earlier figures <b>under-counted conversion</b>. The same quote often re-entered the system in a later month — e.g. when a customer asked for a change — and got counted twice, inflating the quote numbers. AI spotted these repeat patterns and <b>cleaned the whole dataset so each customer is counted once</b> — giving the accurate conversion shown here.</div></div>
<div class=&quot;cols&quot;>
<div class=&quot;card&quot;><h2>What the data says</h2>
<ul>
<li><b>Quoting demand is broadly intact</b> — slightly fewer customers, quoted at <b>higher values</b> (+22% average quote).</li>
<li><b>Conversion has collapsed</b> — sales fell far faster than quotes.</li>
<li>This is <b>where the business is being lost</b>.</li>
</ul></div>
<div class=&quot;card&quot;><h2>Why — all in play</h2>
<ul>
<li><b>Price at the decision point</b> — higher quotes accepted, then not proceeded with.</li>
<li><b>Selling &amp;amp; closing</b> — follow-up and objection-handling at the sites.</li>
<li><b>Marketing</b> — thinner NGB promotion, colder leads.</li>
<li><b>Product steering</b> — losing to rivals at dual-brand sites.</li>
</ul></div>
</div>

<div class=&quot;ask&quot;><b>Response — three levers, not one:</b> fix the price list to the true target — <b>2023 +10% then +7.5%</b> (+18.25%, revenue-neutral), <b>invest in sales conversion</b> where the loss sits, and <b>rebuild marketing</b> to lift quote volume.</div>

<div class=&quot;mast&quot;><h1>NGB vs THE MARKET — like-for-like, fully specced</h1>
<p>Every competitor is specced UP to match a fully-finished NGB unit: <b>coloured finish, dearest paintable cladding, dearest roof, laminate floor + skirting + internal finishes, full insulation, installed</b>. All figures are <b>building + base, electrics excluded</b>. Where a maker doesn't publish an option price it is a flagged estimate (<b>*</b>).</p></div>
<div class=&quot;verdict&quot;><h3>The verdict</h3>Once every maker is specced to the same finished standard, <b>NGB sits mid-pack — not the expensive outlier</b>. At <b>~2.5×2.5m</b>, Madison (£17,749) has four makers below and three above. At <b>~4×3m</b>, Anglesey (£21,949) sits mid-table and premium Greenwich (£25,525) still undercuts eDEN, Green Retreats and a fully-specced Malvern. The cheap timber headlines vanish once coloured finish, upgraded cladding, flooring and internal finishes are added — Malvern goes from &quot;cheapest&quot; to <b>£26,897 at mid</b>.</div>

<p>Source of truth: the Mint all-time quote export (NGB only). Unique customers counted <b>within each period</b> (deduped to each customer's lowest quote). Sales from the NGB MASTER ledger. Verified against Justin's own Excel dedupe: Jan–Aug 2025 = 827 (exact match).</p></div>
